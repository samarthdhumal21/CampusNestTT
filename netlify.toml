# ==============================================================================
# Netlify Production Configuration for CampusNest Kolhapur
# ==============================================================================

[build]
  # The directory to build (default: root)
  # The command that Netlify runs to build your project
  command = "npm run build"
  # The directory where the compiled production assets are output
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# ------------------------------------------------------------------------------
# SPA Redirect Rules
# Handles HTML5 pushState routing (deep links, page reloads, routes)
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ------------------------------------------------------------------------------
# Security Headers
# ------------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

# ------------------------------------------------------------------------------
# Static Asset Caching (Vite content-hashed bundles)
# ------------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
